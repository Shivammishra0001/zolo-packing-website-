# Development stack: PostgreSQL + the API.
#
# The credentials below are DEVELOPMENT-ONLY defaults. They exist so the stack
# comes up with no setup. Override every one of them before deploying anywhere
# reachable from outside your machine.

services:
  postgres:
    image: postgres:16-alpine
    container_name: rehab_hms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rehab_hms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # dev only — override in any shared environment
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # The API waits on this, so it only starts once Postgres accepts queries.
      test: ["CMD-SHELL", "pg_isready -U postgres -d rehab_hms"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rehab_hms_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # "postgres" is the compose service name, not localhost.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/rehab_hms
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-before-deploying}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      # Live reload during development; drop this for a production image.
      - ./app:/app/app:ro
      - ./alembic:/app/alembic:ro
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
    name: rehab_hms_postgres_data
