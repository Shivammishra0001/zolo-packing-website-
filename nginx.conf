server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Uploaded product images can be large; seller documents are streamed by the
  # API (never served statically), so this only bounds legitimate uploads.
  client_max_body_size 20m;

  # ---- API proxy ----------------------------------------------------------
  # The frontend calls same-origin "/api/v1" in production builds (see
  # src/lib/api-config.ts), so nginx must forward those to the API container.
  # Without this block every authenticated request 404s against the SPA
  # fallback below and the app looks broken while the API is perfectly healthy.
  location /api/ {
    proxy_pass http://api:5001;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # The API sets TRUST_PROXY_HOPS=1 so req.ip resolves to the real client
    # here — rate limiting depends on it being the client, not the proxy.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
  }

  # Product images written by the API. Seller KYC documents live in a separate
  # private directory that has no static mount and is never proxied here.
  location /uploads/ {
    proxy_pass http://api:5001;
    proxy_set_header Host $host;
    proxy_cache_valid 200 7d;
  }

  # ---- Static assets ------------------------------------------------------
  # Vite emits content-hashed filenames, so these can be cached indefinitely.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must never be cached, or a browser keeps loading the old bundle
  # after a deploy and calls API routes that may no longer exist.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  # ---- Security headers ---------------------------------------------------
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # ---- SPA fallback -------------------------------------------------------
  # React Router owns client-side routes, so any path that isn't a real file
  # falls back to index.html. Declared last so it cannot shadow /api/.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
