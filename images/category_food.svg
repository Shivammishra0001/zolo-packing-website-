<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <linearGradient id="kraft-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e4cdad" />
      <stop offset="100%" stop-color="#c5a982" />
    </linearGradient>
    <linearGradient id="kraft-side" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b6976f" />
      <stop offset="100%" stop-color="#9d7e56" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.08"/>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Pizza Box (Flat base box) -->
    <!-- Shadow under pizza box -->
    <ellipse cx="250" cy="380" rx="180" ry="25" fill="#e5e5e5" opacity="0.6"/>
    
    <!-- Pizza Box Paths -->
    <!-- Base Front Left Face -->
    <path d="M 90 280 L 250 320 L 250 345 L 90 305 Z" fill="url(#kraft-side)"/>
    <!-- Base Front Right Face -->
    <path d="M 250 320 L 410 280 L 410 305 L 250 345 Z" fill="#9d7e56"/>
    <!-- Top Lid Face -->
    <path d="M 90 280 L 250 240 L 410 280 L 250 320 Z" fill="url(#kraft-top)"/>
    
    <!-- Burger Box (Smaller taller box on top) -->
    <!-- Shadow under burger box -->
    <ellipse cx="250" cy="230" rx="70" ry="12" fill="#d4d4d4" opacity="0.5"/>
    <!-- Burger Box Paths -->
    <!-- Base Front Left -->
    <path d="M 180 180 L 250 200 L 250 230 L 180 210 Z" fill="url(#kraft-side)"/>
    <!-- Base Front Right -->
    <path d="M 250 200 L 320 180 L 320 210 L 250 230 Z" fill="#9d7e56"/>
    <!-- Lid Front Left -->
    <path d="M 180 150 L 250 170 L 250 180 L 180 160 Z" fill="url(#kraft-top)"/>
    <!-- Lid Front Right -->
    <path d="M 250 170 L 320 150 L 320 160 L 250 180 Z" fill="#b6976f"/>
    <!-- Lid Top Face -->
    <path d="M 180 150 L 250 130 L 320 150 L 250 170 Z" fill="url(#kraft-top)"/>
  </g>
</svg>