<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <linearGradient id="sticker-roll" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e5e7eb" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.08"/>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Shadow -->
    <ellipse cx="250" cy="370" rx="110" ry="18" fill="#e5e5e5"/>
    
    <!-- Outer Roll Cylinder -->
    <path d="M 160 210 A 100 30 0 0 0 340 210 L 340 350 A 100 30 0 0 1 160 350 Z" fill="url(#sticker-roll)"/>
    
    <!-- Top Face of Roll (Inner Cardboard core) -->
    <ellipse cx="250" cy="210" rx="90" ry="25" fill="#f3f4f6"/>
    <!-- Inner Cardboard Core hole -->
    <ellipse cx="250" cy="210" rx="40" ry="12" fill="#d1a677"/>
    <ellipse cx="250" cy="210" rx="30" ry="9" fill="#9c6d3b"/>
    
    <!-- Blank Labels on Roll -->
    <!-- Pink Sticker -->
    <path d="M 180 250 A 100 30 0 0 0 240 270 L 240 310 A 100 30 0 0 1 180 290 Z" fill="#fecdd3"/>
    <!-- Blue Sticker -->
    <path d="M 260 275 A 100 30 0 0 0 320 262 L 320 302 A 100 30 0 0 1 260 315 Z" fill="#dbeafe"/>
  </g>
</svg>