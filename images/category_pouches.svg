<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <linearGradient id="pouch-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8a55c" />
      <stop offset="50%" stop-color="#f27d22" />
      <stop offset="100%" stop-color="#d65f0a" />
    </linearGradient>
    <linearGradient id="bag-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8cfb0" />
      <stop offset="100%" stop-color="#c1a581" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-opacity="0.08"/>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Kraft Bag (Back Left) -->
    <ellipse cx="210" cy="380" rx="90" ry="15" fill="#e5e5e5"/>
    <!-- Bag Body -->
    <path d="M 140 180 L 280 180 L 290 375 L 130 375 Z" fill="url(#bag-grad)"/>
    <!-- Bag Side Fold -->
    <path d="M 130 375 L 140 180 L 125 190 L 115 365 Z" fill="#a1845f"/>
    <!-- Bag Handles -->
    <path d="M 180 180 Q 180 130 210 130 Q 240 130 240 180" fill="none" stroke="#8c6d46" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Orange Stand-Up Pouch (Front Right) -->
    <ellipse cx="320" cy="390" rx="70" ry="12" fill="#d4d4d4" opacity="0.8"/>
    <!-- Pouch Body -->
    <path d="M 270 200 C 270 190 280 190 290 190 L 350 190 C 360 190 370 190 370 200 L 360 380 C 360 390 350 390 320 390 C 290 390 280 390 280 380 Z" fill="url(#pouch-grad)"/>
    <!-- Zipper Press Line -->
    <line x1="282" y1="215" x2="358" y2="215" stroke="#a24300" stroke-width="2"/>
    <!-- Sealed Border -->
    <path d="M 270 200 L 280 380" fill="none" stroke="#d65f0a" stroke-width="6" opacity="0.3"/>
    <path d="M 370 200 L 360 380" fill="none" stroke="#d65f0a" stroke-width="6" opacity="0.3"/>
  </g>
</svg>