<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <linearGradient id="black-tube" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d2d2d" />
      <stop offset="40%" stop-color="#404040" />
      <stop offset="70%" stop-color="#222222" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>
    <linearGradient id="green-tube" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a4b39b" />
      <stop offset="40%" stop-color="#c1d0b7" />
      <stop offset="70%" stop-color="#93a38a" />
      <stop offset="100%" stop-color="#7c8c73" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-opacity="0.08"/>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Black Tube (Left) -->
    <ellipse cx="200" cy="390" rx="45" ry="10" fill="#e5e5e5"/>
    <path d="M 160 160 Q 200 165 240 160 L 230 380 Q 200 395 170 380 Z" fill="url(#black-tube)"/>
    <!-- Black Cap -->
    <rect x="180" y="385" width="40" height="20" rx="3" fill="#141414"/>
    <!-- Tube Crimp end -->
    <rect x="156" y="145" width="88" height="15" rx="2" fill="#1a1a1a"/>
    
    <!-- Green Tube (Right) -->
    <ellipse cx="300" cy="380" rx="40" ry="8" fill="#d4d4d4"/>
    <path d="M 265 190 Q 300 195 335 190 L 325 375 Q 300 388 275 375 Z" fill="url(#green-tube)"/>
    <!-- Green Cap -->
    <rect x="285" y="378" width="30" height="18" rx="3" fill="#66755d"/>
    <!-- Crimp -->
    <rect x="261" y="178" width="78" height="12" rx="2" fill="#87957d"/>
  </g>
</svg>