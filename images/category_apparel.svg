<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <linearGradient id="white-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f0f0" />
    </linearGradient>
    <linearGradient id="black-bag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-opacity="0.08"/>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- White Gift Box (Left) -->
    <ellipse cx="190" cy="380" rx="90" ry="18" fill="#e5e5e5"/>
    <!-- Base Front Left Face -->
    <path d="M 100 290 L 190 320 L 190 345 L 100 315 Z" fill="#e5e7eb"/>
    <!-- Base Front Right Face -->
    <path d="M 190 320 L 280 290 L 280 315 L 190 345 Z" fill="#d1d5db"/>
    <!-- Top Lid Face -->
    <path d="M 100 290 L 190 260 L 280 290 L 190 320 Z" fill="url(#white-box)"/>
    
    <!-- Black Shopping Bag (Right) -->
    <ellipse cx="320" cy="390" rx="75" ry="12" fill="#d4d4d4"/>
    <!-- Bag body -->
    <path d="M 265 210 L 375 210 L 380 380 L 260 380 Z" fill="url(#black-bag)"/>
    <path d="M 260 380 L 265 210 L 250 220 L 245 375 Z" fill="#111827"/>
    <!-- Rope handles -->
    <path d="M 295 210 Q 295 170 320 170 Q 345 170 345 210" fill="none" stroke="#d1d5db" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>