<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <linearGradient id="corrugated-kraft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dec4a2" />
      <stop offset="100%" stop-color="#bda07b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-opacity="0.08"/>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Shadow -->
    <ellipse cx="250" cy="380" rx="140" ry="20" fill="#e5e5e5"/>
    
    <!-- Mailer box Paths -->
    <!-- Base Front Left Face -->
    <path d="M 120 220 L 250 270 L 250 350 L 120 300 Z" fill="#b19472"/>
    <!-- Base Front Right Face -->
    <path d="M 250 270 L 380 220 L 380 300 L 250 350 Z" fill="#9d805e"/>
    <!-- Top Lid Face -->
    <path d="M 120 220 L 250 170 L 380 220 L 250 270 Z" fill="url(#corrugated-kraft)"/>
  </g>
</svg>